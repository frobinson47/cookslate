services:
  app:
    build: .
    container_name: cookslate-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - uploads:/var/www/html/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - web
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=cookslate_db
      - DB_USER=cookslate
      - DB_PASS=cookslate
      - USDA_API_KEY=${USDA_API_KEY:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - APP_URL=${APP_URL:-}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:-}
      - COOKSLATE_API_KEY=${COOKSLATE_API_KEY:-}

  db:
    image: mysql:8
    container_name: cookslate-db
    restart: unless-stopped
    volumes:
      - dbdata:/var/lib/mysql
    environment:
      MYSQL_DATABASE: cookslate_db
      MYSQL_USER: cookslate
      MYSQL_PASSWORD: cookslate
      MYSQL_ROOT_PASSWORD: cookslate_root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  web:
    external: true
    name: web

volumes:
  uploads:
  dbdata:
