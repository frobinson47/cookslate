<VirtualHost *:80>
    DocumentRoot /var/www/html

    # API — let .htaccess handle routing
    <Directory /var/www/html/api>
        AllowOverride All
        Require all granted

        # Override .htaccess block on install.php for Docker first-run
        <Files "install.php">
            Require all granted
        </Files>
    </Directory>

    # Uploads — serve static files
    Alias /uploads /var/www/html/uploads
    <Directory /var/www/html/uploads>
        Require all granted
        Options -Indexes
    </Directory>

    # Frontend — serve built SPA
    <Directory /var/www/html/frontend/dist>
        Require all granted
        Options -Indexes

        # Entry files keep the same name across deploys: always revalidate, so a
        # returning browser never runs a stale index.html pointing at deleted assets.
        <FilesMatch "^(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
    </Directory>

    # Hashed build output never changes under the same name
    <Directory /var/www/html/frontend/dist/assets>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    # Routing rules
    RewriteEngine On

    # API requests → pass through to api/ directory (let .htaccess handle it)
    RewriteRule ^/api(/.*)?$ /api$1 [L,PT]

    # Upload requests → serve as-is
    RewriteRule ^/uploads(/.*)?$ - [L]

    # Static frontend assets — serve directly if file exists
    RewriteCond /var/www/html/frontend/dist%{REQUEST_URI} -f
    RewriteRule ^(.*)$ /frontend/dist$1 [L]

    # A missing build asset is a real 404, not the SPA page: serving index.html
    # as JavaScript is what made stale tabs fail with a confusing error
    RewriteRule ^/assets/ - [R=404,L]

    # Everything else → frontend SPA
    RewriteRule ^(.*)$ /frontend/dist/index.html [L]
</VirtualHost>
